<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Mandarim Acadêmico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#1b1b1f;--muted:#6b6f7b;--line:#e8e9ee;--mist:#f4f5f8;--ver:#c73e3a;--ver-soft:#fbe9e7;--jade:#1f8a70;--jade-soft:#e3f4ee;--indigo:#3d5afe;--indigo-soft:#e8ecff;--gold:#e0a52d;--gold-soft:#fcf3dc;--plum:#7b3fa0;--plum-soft:#f1e7f8;--sky:#0ea5c9;--sky-soft:#e0f5fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff}
body{color:var(--ink);font:16px/1.55 "Manrope",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
.zh,.hz{font-family:"Noto Serif SC","Manrope",serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 18px 100px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.seal{width:36px;height:36px;border-radius:9px;background:var(--ver);color:#fff;display:grid;place-items:center;font-family:"Noto Serif SC",serif;font-size:20px;font-weight:700}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:-2px}
.gear{width:38px;height:38px;border-radius:50%;background:var(--mist);border:0;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.card.tint{border:0}
.hero{border:0;background:linear-gradient(160deg,#fff 0%,#fff6f5 100%);border:1px solid #f4dcda;display:flex;gap:16px;align-items:center}
.hero .big{font-family:"Noto Serif SC",serif;font-size:84px;line-height:1;font-weight:700;color:var(--ink);min-width:96px;text-align:center}
.hero .py{color:var(--ver);font-weight:700;font-size:18px}
.hero .pt{color:var(--muted);font-size:14px;margin-top:2px}
.hero small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.ring b small{font-size:11px;color:var(--muted);font-weight:600;display:block;text-align:center}
.stat{display:flex;gap:8px}
.stat div{flex:1;background:var(--mist);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:6px 0 10px}
h3{font-size:15px;font-weight:800;margin:0 0 8px}
p{margin:6px 0}
.sm{font-size:13px;color:var(--muted)}
button{font:inherit;border:0;border-radius:14px;padding:13px 18px;cursor:pointer;background:var(--ink);color:#fff;font-weight:700;transition:transform .08s}
button:active{transform:scale(.97)}
button.pri{background:var(--ver)}
button.sec{background:var(--mist);color:var(--ink)}
button.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
button.full{width:100%}
button.lg{font-size:17px;padding:16px}
button:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{padding:16px 12px;border-radius:16px;text-align:left;display:flex;flex-direction:column;gap:4px;line-height:1.25}
.actions small{font-weight:500;opacity:.85;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{background:var(--mist);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid transparent}
.chip.on{background:#fff;border-color:var(--ink)}
.modcard{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;background:#fff}
.modcard .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:"Noto Serif SC",serif;font-size:26px;font-weight:700;flex:none}
.modcard .t{flex:1;min-width:0}
.modcard .t b{display:block;font-size:15px}
.modcard .t span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--mist);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px}
.modcard .btns{display:flex;flex-direction:column;gap:6px}
.modcard .btns button{padding:8px 12px;font-size:13px;border-radius:10px}
.lvl{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.lvl.b{background:var(--jade-soft);color:var(--jade)}.lvl.i{background:var(--plum-soft);color:var(--plum)}
/* exercícios */
.ex{border:1px solid var(--line);border-radius:22px;padding:22px 20px;background:#fff}
.exhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.exhead span:last-child{padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--ink)}
.prog{height:5px;background:var(--mist);border-radius:5px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:var(--ver);border-radius:5px;transition:width .3s}
.qzh{font-family:"Noto Serif SC",serif;font-size:46px;line-height:1.25;text-align:center;font-weight:600;margin:6px 0 2px}
.qpy{text-align:center;color:var(--ver);font-weight:700;font-size:20px}
.qpt{text-align:center;color:var(--muted);font-size:17px;margin-top:4px}
.qask{text-align:center;font-size:20px;font-weight:800;margin:6px 0 4px;line-height:1.3}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:2px 0 14px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);color:var(--ink);margin-top:9px;font-weight:600;padding:14px 16px;border-radius:14px;font-size:16px}
.opt .hz{font-size:22px;font-weight:600}
.opt .p{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.opt.ok{border-color:var(--jade);background:var(--jade-soft)}
.opt.bad{border-color:var(--ver);background:var(--ver-soft)}
.speak{width:56px;height:56px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);font-size:22px;display:grid;place-items:center;margin:10px auto;padding:0}
.mic{width:92px;height:92px;border-radius:50%;background:var(--ver);color:#fff;font-size:36px;display:grid;place-items:center;margin:16px auto;padding:0;box-shadow:0 10px 24px rgba(199,62,58,.28)}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.score{font-size:40px;font-weight:800;text-align:center;margin-top:8px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.tile{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:600;width:54px;height:54px;border-radius:12px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;padding:0;color:var(--ink)}
.tile.used{opacity:.25}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:14px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:6px;margin-bottom:8px}
.slot .tile{border-color:var(--ink)}
.mark{color:var(--ver);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.pair{display:flex;gap:10px;margin-top:12px}
.pair button{flex:1}
.note{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:14px;color:#6b4d05;margin-bottom:12px}
.err{background:var(--ver-soft);border-radius:14px;padding:12px 14px;font-size:14px;color:#8a2622}
/* dicionário */
.search{display:flex;align-items:center;gap:10px;background:var(--mist);border-radius:16px;padding:6px 14px;margin-bottom:8px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;padding:10px 0;outline:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .hz{font-size:24px;font-weight:600;min-width:0}
.row .info{flex:1;min-width:0}
.row .info span{display:block;font-size:13px;color:var(--muted)}
.row .info em{font-style:normal;color:var(--ver);font-weight:700;font-size:13px}
.row button{padding:8px 10px;border-radius:10px;font-size:14px}
.detail .zh{font-size:60px;text-align:center;font-weight:700;line-height:1.2}
.charrow{display:flex;gap:10px;overflow-x:auto;padding:6px 0}
.charrow div{flex:none;background:var(--mist);border-radius:14px;padding:10px 12px;text-align:center;min-width:76px}
.charrow .hz{font-size:30px;font-weight:700;display:block}
.charrow small{display:block;color:var(--ver);font-weight:700;font-size:12px}
.charrow span{display:block;font-size:12px;color:var(--muted);max-width:110px}
.k{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.k:last-child{border:0}
input.f,select{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;background:#fff}
label{font-size:13px;color:var(--muted);font-weight:700;display:block;margin:12px 0 5px}
canvas{max-height:200px}
.hid{display:none}
.c{text-align:center}
.mt{margin-top:12px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res div{background:var(--mist);border-radius:14px;padding:12px;text-align:center}
.res b{display:block;font-size:24px;font-weight:800}
.res span{font-size:12px;color:var(--muted);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:9px 2px 8px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ver)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* avatar e gamificação */
.tutor{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.tutor svg{width:64px;height:64px;flex:none}
.bubble{background:var(--mist);border-radius:18px;border-top-left-radius:4px;padding:10px 14px;flex:1}
.bubble b{display:block;font-family:"Noto Serif SC",serif;font-size:18px}
.bubble span{font-size:13px;color:var(--muted)}
.xpbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:700}
.xpbar .bar{flex:1;margin:0;height:8px}
.combo{display:inline-block;background:var(--gold-soft);color:#7a5507;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
.fb{margin-top:14px;border-radius:16px;padding:14px;animation:pop .25s ease-out}
.fb.ok{background:var(--jade-soft)}.fb.bad{background:var(--ver-soft)}
.fb h4{margin:0 0 4px;font-size:16px}
.fb .ans{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:600}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.conf{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9}
.conf i{position:absolute;width:9px;height:9px;border-radius:2px;animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(90vh) rotate(400deg);opacity:0}}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.badge .b{width:56px;height:56px;border-radius:16px;margin:0 auto 4px;display:grid;place-items:center;font-size:24px;background:var(--mist);filter:grayscale(1);opacity:.45}
.badge.on .b{filter:none;opacity:1;background:var(--gold-soft)}
.lvup{position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:20;display:grid;place-items:center;text-align:center;padding:24px}
.lvup .zh{font-size:72px;font-weight:700;color:var(--ver)}
.avatarbig svg{width:120px;height:120px}

/* conversa */
.card{border:0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
.hero{border:0}
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 220px)}
.tutorhead{display:flex;flex-direction:column;align-items:center;padding:4px 0 14px}
.tutorhead svg{width:132px;height:132px}
.tutorhead b{font-size:15px}
.tutorhead span{font-size:12px;color:var(--muted)}
.msgs{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.m{max-width:88%;padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.5}
.m.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.m.a{align-self:flex-start;background:var(--mist);border-bottom-left-radius:5px}
.m .zhl{font-family:"Noto Serif SC",serif;font-size:30px;line-height:1.3;font-weight:600;margin:8px 0 2px}
.m .pyl{color:var(--ver);font-weight:700;font-size:16px}
.m .ptl{color:var(--muted);font-size:14px;margin-bottom:6px}
.m .tip{font-size:13px;color:var(--muted);border-top:1px solid #e3e5ea;padding-top:8px;margin-top:8px}
.m .mb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.m .mb button{padding:8px 12px;font-size:13px;border-radius:10px}
.think{display:inline-flex;gap:5px}.think i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.25;transform:translateY(-3px)}}
.inbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px;z-index:6}
.inbar .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--mist);border-radius:22px;padding:6px 6px 6px 16px}
.inbar input{flex:1;border:0;background:none;font:inherit;font-size:16px;outline:0;min-width:0}
.inbar button{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:18px}
.inbar button.mic2{background:var(--ver)}
.inbar button.mic2.rec{animation:pulse 1s infinite}
.chips.sugg{margin:0 0 10px}
.chips.sugg .chip{font-weight:600;font-size:12px}
.spk .mouth{animation:talk .25s infinite alternate}
@keyframes talk{to{transform:scaleY(2.2)}}

.avwrap{position:relative;width:148px;height:148px;margin:0 auto 6px}
.avwrap img{width:148px;height:148px;border-radius:50%;object-fit:cover;display:block;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.avwrap .ringa{position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--ver);opacity:0}
.avwrap.spk .ringa{animation:ring 1.1s ease-out infinite}
.avwrap.spk img{animation:bob 1.1s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.96);opacity:.7}100%{transform:scale(1.18);opacity:0}}
@keyframes bob{50%{transform:translateY(-3px)}}
.follow{margin-top:10px;background:#fff;border-radius:12px;padding:10px 12px}
.follow .hz{font-size:20px;font-weight:600}
textarea.f{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;min-height:150px;line-height:1.45}

.tutor img.tav{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.tutor img.tav.spk{animation:bob 1s ease-in-out infinite}
.fullav{display:block;height:260px;margin:0 auto 6px}
.fb.ok h4{color:var(--jade)}.fb.bad h4{color:var(--ver)}
.cheer{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.cheer img{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none}
.cheer b{font-family:"Noto Serif SC",serif;font-size:20px;display:block}
.cheer span{font-size:13px;color:var(--muted)}
.tap{cursor:pointer;-webkit-tap-highlight-color:rgba(199,62,58,.15)}.tap:active{opacity:.6}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand"><div class="seal">学</div><div><b>Mandarim Acadêmico</b><span id="sub">Universidade, clima e saúde · v11</span></div></div>
<button class="gear" onclick="go('settings')" aria-label="Ajustes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<div id="view"></div>
</div>
<div class="inbar" id="inbar"><div class="in"><input id="cin" placeholder="Pergunte ou fale em chinês" onkeydown="if(event.key==='Enter')sendChat()"><button class="mic2" id="cmic" onclick="chatMic()">🎤</button><button onclick="sendChat()">➤</button></div></div>
<nav>
<button data-v="chat" class="on"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>Conversa</button>
<button data-v="home"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Curso</button>
<button data-v="dict"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>Dicionário</button>
<button data-v="progress"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>Progresso</button>

let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";if(voice)u.voice=voice;u.rate=S.set.voiceRate;speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function normZh(s){return (s||"").replace(/[\s，。？！,.?!、\u3000]/g,"").replace(/[A-Za-z]+/g,x=>x.toLowerCase())}
function lcs(a,b){const n=b.length;let prev=new Array(n+1).fill(0);for(let i=1;i<=a.length;i++){const cur=[0];for(let j=1;j<=n;j++)cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]);prev=cur}return prev[n]}
function scoreSpeech(t,h){t=normZh(t);h=normZh(h);if(!t.length)return 0;return Math.round(100*lcs(t,h)/Math.max(t.length,h.length||1))}
const ERRPT={"not-allowed":"Permissão de microfone negada. Toque no cadeado ao lado do endereço, Permissões, Microfone, Permitir.","service-not-allowed":"O serviço de reconhecimento foi bloqueado. Abra a página pelo endereço https do GitHub Pages.","no-speech":"Não captei fala. Fale logo após tocar no microfone, perto do aparelho. No Android, confira se o app Google e o serviço de reconhecimento de fala do Google estão instalados e ativos.","audio-capture":"Nenhum microfone encontrado ou ele está em uso por outro app.","network":"Sem conexão. O reconhecimento usa a internet.","aborted":"Escuta interrompida. Tente de novo.","language-not-supported":"Este navegador não reconhece chinês."};
let recObj=null;
async function listen(onRes,onErr,onStart){return listenLang("zh-CN",onRes,onErr,onStart)}
async function listenLang(lang,onRes,onErr,onStart){if(!SR){onErr("Este navegador não reconhece voz. Use o Chrome no Android, pelo endereço https.");return}
 if(location.protocol!=="https:"&&location.hostname!=="localhost"){onErr("O microfone só funciona em página https. Abra o app pelo endereço do GitHub Pages, não pelo arquivo.");return}
 let granted=false;try{if(navigator.permissions&&navigator.permissions.query){const p=await navigator.permissions.query({name:"microphone"});granted=p.state==="granted"}}catch(e){}
 if(!granted){try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());await new Promise(r=>setTimeout(r,400))}}catch(e){onErr(ERRPT["not-allowed"]+" ("+e.name+")");return}}
 speechSynthesis.cancel();const r=new SR();recObj=r;r.lang=lang;r.maxAlternatives=3;r.interimResults=true;r.continuous=false;let done=false,partial="";
 r.onstart=()=>{if(onStart)onStart()};
 r.onresult=e=>{const res=e.results[e.results.length-1];if(!res.isFinal){partial=res[0].transcript;if(onStart)onStart(partial);return}done=true;const a=[];for(let i=0;i<res.length;i++)a.push(res[i].transcript);onRes(a)};
 r.onerror=e=>{done=true;onErr(ERRPT[e.error]||("Microfone: "+e.error))};
 r.onend=()=>{if(!done){done=true;if(partial)onRes([partial]);else onErr(ERRPT["no-speech"]+" Se isso se repetir, use o ditado pelo teclado logo abaixo.")}};
 try{r.start()}catch(e){onErr("Não consegui iniciar a escuta: "+e.message)}
 setTimeout(()=>{if(!done){try{r.stop()}catch(e){}}},12000)}

 <div class="card"><h3>Conversa com a professora</h3><p class="sm">Para ela responder a qualquer pergunta é preciso uma chave da API da Anthropic (console.anthropic.com). A chave fica só neste aparelho e cada pergunta é cobrada na sua conta. Sem chave, a conversa responde apenas com o que existe no dicionário do curso.</p><label>Chave da API</label><input class="f" id="ak" type="text" autocomplete="off" value="${esc(S.set.apiKey||"")}" placeholder="sk-ant-..." oninput="S.set.apiKey=this.value.trim();save();document.getElementById('akst').textContent=S.set.apiKey?'Chave gravada (termina em '+S.set.apiKey.slice(-4)+')':'Nenhuma chave gravada'"><p class="sm" id="akst">${S.set.apiKey?"Chave gravada (termina em "+esc(S.set.apiKey.slice(-4))+")":"Nenhuma chave gravada"}</p><label>Modelo</label><input class="f" id="md" value="${esc(S.set.model||"claude-haiku-4-5-20251001")}" oninput="S.set.model=this.value.trim();save()"><button class="full mt" onclick="saveAPI()">Salvar e testar a chave</button><div id="aktest"></div><label>Seu perfil (o que a professora sabe sobre você)</label><textarea class="f" id="pf">${esc(profileText())}</textarea><label>Foto da professora (opcional, fica só neste aparelho)</label><input class="f" type="file" accept="image/*" onchange="setAvatar(this)">${S.set.avatar?'<button class="ghost full" style="margin-top:8px" onclick="S.set.avatar=\'\';save();render()">Remover foto</button>':""}<button class="sec full mt" onclick="genModule()" ${S.set.apiKey?"":"disabled"}>Gerar módulo "Meu vocabulário" pela API</button><p class="sm">Cria 40 termos da sua área a partir do perfil. Uma chamada maior, cerca de 5 centavos no Haiku.</p><label>Idioma do microfone na conversa</label><select id="ml"><option value="pt-BR" ${S.set.micLang==="pt-BR"?"selected":""}>Português (perguntar)</option><option value="zh-CN" ${S.set.micLang==="zh-CN"?"selected":""}>Chinês (praticar)</option></select></div>
 <div class="card"><h3>Backup</h3><p class="sm">Exporte o JSON para trocar de aparelho. No iPhone, o Safari pode apagar dados de sites sem uso por alguns dias; exporte com frequência.</p><button class="ghost full" onclick="exportJSON()">Exportar progresso (JSON)</button><label>Importar progresso</label><input class="f" type="file" accept=".json" onchange="importJSON(this,'prog')"></div>
 <div class="card"><h3>Módulos extras</h3><p class="sm">Formato: {"modules":[{"id":"x","lv":2,"title":"…","desc":"…","items":[{"zh":"…","py":"…","pt":"…"}]}]}. Id repetido substitui o módulo.</p><input class="f" type="file" accept=".json" onchange="importJSON(this,'mods')"><p class="sm">Extras instalados: ${(S.custom||[]).length}</p></div>
 <div class="card"><h3>Aparelho</h3><div class="k"><span>Endereço seguro (https)</span><b>${location.protocol==="https:"?"sim":"não, microfone bloqueado"}</b></div><div class="k"><span>Reconhecimento de voz</span><b>${SR?"disponível":"indisponível"}</b></div><div class="k"><span>Microfone</span><b id="micst">verificando…</b></div><div class="k"><span>Voz em chinês</span><b>${voice?voice.name:"não encontrada"}</b></div><button class="ghost full mt" onclick="speak('你好，我叫 Ernandes，我是巴西人')">Testar voz</button><button class="sec full mt" onclick="micTest()">Testar microfone em chinês</button><button class="ghost full mt" onclick="micTestPT()">Testar microfone em português</button><div id="mictest"></div></div>
 <div class="card"><button class="ghost full" style="color:var(--ver)" onclick="if(confirm('Apagar todo o progresso deste aparelho?')){localStorage.removeItem(KEY);S=load();go('home')}">Apagar progresso</button></div>`;
 const ms=document.getElementById("micst");if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:"microphone"}).then(p=>{ms.textContent={granted:"permitido",denied:"negado no navegador",prompt:"ainda não pedido"}[p.state]||p.state}).catch(()=>{ms.textContent="não verificável"})}else ms.textContent="não verificável"}
function micTestPT(){const b=document.getElementById("mictest");b.innerHTML='<p class="sm">Diga "bom dia"…</p>';listenLang("pt-BR",alts=>{b.innerHTML=`<div class="note">Ouvi em português: ${esc(alts.join(" / "))}. O motor funciona; se o chinês falhar, é o idioma que está faltando no serviço de fala do Google.</div>`},err=>{b.innerHTML=`<div class="err">${err}</div>`},p=>{b.innerHTML=`<p class="sm" style="color:var(--ver);font-weight:700">Fale agora…</p>${p?`<p>${esc(p)}</p>`:""}`})}
function micTest(){const b=document.getElementById("mictest");b.innerHTML='<p class="sm">Diga 你好 (nǐ hǎo)…</p>';listen(alts=>{b.innerHTML=`<div class="note">Ouvi: ${esc(alts.join(" / "))}</div>`},err=>{b.innerHTML=`<div class="err">${err}</div>`},p=>{b.innerHTML=`<p class="sm" style="color:var(--ver);font-weight:700">Fale agora…</p>${p?`<p class="hz" style="font-size:22px;margin:0">${esc(p)}</p>`:""}`})}
function setAvatar(inp){const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);const c=document.createElement("canvas");c.width=c.height=360;c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,360,360);S.set.avatar=c.toDataURL("image/jpeg",0.82);save();render()};img.src=URL.createObjectURL(f)}
async function genModule(){if(!S.set.apiKey)return;if(!confirm("Gerar o módulo agora? Usa a API uma vez."))return;const b=event.target;b.disabled=true;b.textContent="Gerando…";
 try{const sys=`Você é professora de mandarim. Gere vocabulário técnico e profissional em chinês simplificado para este aluno:\n${profileText()}\nResponda SOMENTE com JSON puro no formato {"modules":[{"id":"meu-vocab","lv":2,"title":"Meu vocabulário","desc":"Termos da minha área","items":[{"zh":"...","py":"pinyin com tons","pt":"tradução curta em português"}]}]} com exatamente 40 itens: 25 termos ou expressões da área de pesquisa dele e 15 frases curtas úteis para ele falar do próprio trabalho, cidade e universidade. Chinês correto e natural. Sem markdown.`;
 const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.set.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.set.model,max_tokens:4000,system:sys,messages:[{role:"user",content:"Gere o módulo."}]})});
 if(!r.ok)throw new Error("API "+r.status);const d=await r.json();const txt=(d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").replace(/```json|```/g,"").trim();const j=JSON.parse(txt);if(!Array.isArray(j.modules))throw new Error("formato");
 j.modules.forEach(m=>{S.custom=(S.custom||[]).filter(x=>x.id!==m.id);S.custom.push(m)});save();alert("Módulo criado com "+j.modules[0].items.length+" itens. Veja em Curso, Módulos.");go("modules")}catch(e){alert("Falhou: "+e.message);b.disabled=false;b.textContent='Gerar módulo "Meu vocabulário" pela API'}}
async function saveAPI(){S.set.apiKey=document.getElementById("ak").value.trim();S.set.model=document.getElementById("md").value.trim()||"claude-haiku-4-5-20251001";S.set.profile=document.getElementById("pf").value.trim();S.set.micLang=document.getElementById("ml").value;save();const b=document.getElementById("aktest");if(!S.set.apiKey){b.innerHTML='<div class="err">Cole a chave primeiro.</div>';return}b.innerHTML='<p class="sm">Testando…</p>';
 try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.set.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.set.model,max_tokens:20,messages:[{role:"user",content:"Responda só: 你好"}]})});
 if(!r.ok){const t=await r.text();b.innerHTML=`<div class="err">Falhou (${r.status}). ${r.status===401?"Chave inválida.":r.status===400?"Modelo inválido ou sem crédito.":t.slice(0,140)}</div>`;return}
 const d=await r.json();b.innerHTML=`<div class="note">Funcionou. A professora respondeu: ${esc((d.content||[]).map(c=>c.text||"").join(""))}</div>`}catch(e){b.innerHTML=`<div class="err">Erro de rede: ${esc(e.message)}</div>`}}
function exportJSON(){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mandarim-progresso-"+today()+".json";a.click()}
function importJSON(inp,kind){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
 if(kind==="prog"){if(!d.prog||!d.log)throw 0;S={...S,...d,v:2,tests:d.tests||[],custom:d.custom||S.custom};save();alert("Progresso importado.")}
 else{if(!Array.isArray(d.modules))throw 0;d.modules.forEach(m=>{if(!m.id||!Array.isArray(m.items))throw 0;S.custom=(S.custom||[]).filter(x=>x.id!==m.id);S.custom.push(m)});save();alert(d.modules.length+" módulo(s) importado(s).")}go("home")}catch(e){alert("Arquivo inválido.")}};r.readAsText(f)}
render();
</script></body></html>
